<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>List, Form & Table Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            margin: auto;
        }

        h2 {
            color: #333;
        }

        /* List Style */
        ul {
            background: #e6f2ff;
            padding: 15px;
        }

        ol {
            background: #fff0e6;
            padding: 15px;
        }

        /* Form Style */
        form {
            background: #f9f9f9;
            padding: 15px;
            margin-top: 20px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        /* Table Style */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #333;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Unordered List</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Design</li>
        <li>Develop</li>
        <li>Deploy</li>
    </ol>

    <h2>Registration Form</h2>
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Gender:</label>
        <select>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <button type="submit">Submit</button>
    </form>

    <h2>Student Table</h2>
    <table>
        <address>
            
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Class</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>10</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Anjali</td>
            <td>9</td>
        </tr>
    </table>

</div>

</body>
</html>
