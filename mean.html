<DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Mean of Three Numbers</title>
</head>
<body>
    <script>
        var num1 = 5;
        var num2 = 10;
        var num3 = 15;

        var mean = (num1 + num2 + num3) / 3;

        document.write("The mean of the three numbers is: " + mean);
    </script>
</body>
</html>
