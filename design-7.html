<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Creative Design</title>
<style>
    body {
        margin: 0;
        background: rgb(19, 11, 11);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    canvas {
        background: rgba(5, 15, 11, 0.286);
    }
</style>
</head>
<body>

<canvas id="canvas" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let angle = 0;

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(250, 250);

    for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.rotate(Math.PI / 3);
        for (let j = 0; j < 200; j++) {
            ctx.lineTo(
                j * Math.cos(j * 0.05 + angle),
                j * Math.sin(j * 0.05 + angle)
            );
        }
        ctx.strokeStyle = `hsl(${i * 60 + angle * 50}, 100%, 60%)`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
    }

    ctx.restore();
    angle += 0.01;
    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
