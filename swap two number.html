<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap Two Numbers</title>
</head>
<body>
    <script>
        var a = 5;
        var b = 10;

        document.write("Before swapping: a = " + a + ", b = " + b + "<br>");

        // Swapping logic
        var temp = a;
        a = b;
        b = temp;

        document.write("After swapping: a = " + a + ", b = " + b);
    </script>
</body>
</html>
