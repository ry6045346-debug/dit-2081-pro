<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even or Odd</title>
</head>
<body>
    <script>
        var num = 7;
        if (num % 2 === 0) {
            document.write(num + " is even.");
        } else {
            document.write(num + " is odd.");
        }
    </script>
</body>
</html>
