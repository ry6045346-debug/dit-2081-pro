<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Even Numbers</title>
</head>
<body>
    <script>
        var sum = 0;
        for (var i = 1; i <= 5; i++) {
            if (i % 2 === 0) {
                sum += i;
            }
        }
        document.write("The sum of all even numbers between 1 and 50 is: " + sum);
    </script>
</body>
</html>
