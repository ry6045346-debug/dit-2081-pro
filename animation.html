<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animation Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            margin: auto;
        }

        h2 {
            color: #333;
        }

        /* Animation Style */
        .box {
            width: 100px;
            height: 100px;
            background-color: #4CAF50;
            position: relative;
            animation-name: moveBox;
            animation-duration: 4s;
            animation-iteration-count: infinite;
        }

        @keyframes moveBox {
            0% { left: 0; top: 0; }
            25% { left: 200px; top: 0; }
            50% { left: 200px; top: 200px; }
            75% { left: 0; top: 200px; }
            100% { left: 0; top: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Animated Box</h2>
        <div class="box"></div>
    </div>
    <selectedcontent>
        <p>This is an example of a simple animation using CSS. The green box will move in a square path continuously.</p>
</body>
</html>
