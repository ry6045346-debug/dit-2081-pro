<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider Cursor Animation</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        cursor:none;
    }

    body{
        height:100vh;
        background:#0f172a;
        overflow:hidden;
        position:relative;
    }

    /* Spider Body */
    .spider{
        position:absolute;
        width:40px;
        height:40px;
        background:black;
        border-radius:50%;
        pointer-events:none;
        transform:translate(-50%, -50%);
        z-index:9999;
    }

    /* Spider Eyes */
    .eye{
        position:absolute;
        width:8px;
        height:8px;
        background:white;
        border-radius:50%;
        top:10px;
    }

    .eye.left{
        left:10px;
    }

    .eye.right{
        right:10px;
    }

    /* Spider Legs */
    .leg{
        position:absolute;
        width:25px;
        height:3px;
        background:white;
        transform-origin:left center;
    }

    .leg1{ top:5px; left:-18px; transform:rotate(-30deg); }
    .leg2{ top:15px; left:-20px; transform:rotate(-10deg); }
    .leg3{ top:25px; left:-20px; transform:rotate(10deg); }
    .leg4{ top:35px; left:-18px; transform:rotate(30deg); }

    .leg5{ top:5px; right:-18px; transform:rotate(30deg); }
    .leg6{ top:15px; right:-20px; transform:rotate(10deg); }
    .leg7{ top:25px; right:-20px; transform:rotate(-10deg); }
    .leg8{ top:35px; right:-18px; transform:rotate(-30deg); }

    /* Web Thread */
    .thread{
        position:absolute;
        width:2px;
        background:white;
        top:0;
        left:50%;
        transform:translateX(-50%);
    }

    h1{
        color:white;
        text-align:center;
        margin-top:40vh;
        font-size:40px;
        font-family:Arial, sans-serif;
    }
</style>
</head>
<body>

<div class="thread"></div>

<div class="spider" id="spider">
    <div class="eye left"></div>
    <div class="eye right"></div>

    <div class="leg leg1"></div>
    <div class="leg leg2"></div>
    <div class="leg leg3"></div>
    <div class="leg leg4"></div>

    <div class="leg leg5"></div>
    <div class="leg leg6"></div>
    <div class="leg leg7"></div>
    <div class="leg leg8"></div>
</div>

<h1>Spider Cursor Animation</h1>

<script>
    const spider = document.getElementById("spider");
    const thread = document.querySelector(".thread");
    const centerX = window.innerWidth / 2;

    document.addEventListener("mousemove", (e) => {

        spider.style.left = e.pageX + "px";
        spider.style.top = e.pageY + "px";

        thread.style.left = e.pageX + "px";
        thread.style.height = e.pageY + "px";
    });
</script>

</body>
</html>
