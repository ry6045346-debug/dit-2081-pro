<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find if a Number is Divisible by 7</title>
</head>
<body>
    <script>
        var num = 21;
        if (num % 7 === 0) {
            document.write(num + " is divisible by 7.");
        } else {
            document.write(num + " is not divisible by 7.");
        }
    </script>
</body>
</html>
