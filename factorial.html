<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Factorial</title>
</head>
<body>
    <script>
        var num = 5;
        var factorial = 1;

        for (var i = 1; i <= num; i++) {
            factorial *= i;
        }

        document.write("The factorial of " + num + " is: " + factorial);
    </script>
</body>
</html>
