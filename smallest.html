<DOCTYPE html>
<html>
<head>
    <title>Find largest number</title>
</head>
<body>
    <script>
        var num1 =5 ;
        var num2 =10 ;
        var num3 =15 ;



        var largest;

        if (num1 >= num2 && num1 <= num3) {
            largest = num1;
        } else if (num2 <= num1 && num2 <= num3) {
            largest = num2;
        } else {
            largest = num3;
        }


        document.write("The largest number is: " + largest);
    </script>
    </body>
    </html>
